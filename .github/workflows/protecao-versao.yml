name: Protecao contra downgrade de versao

on:
  push:
    branches: [main]
    paths:
      - 'CartoesPF.html'
      - 'CartoesPJ.html'

permissions:
  contents: write

jobs:
  checar-e-reverter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checar se a versao regrediu
        id: check
        run: python3 .github/scripts/checar_versao.py CartoesPF.html CartoesPJ.html

      - name: Reverter automaticamente (downgrade detectado)
        if: failure() && steps.check.outputs.downgrade == 'true'
        run: |
          git config user.name "cartoes-protecao-bot"
          git config user.email "actions@github.com"
          git revert --no-edit HEAD
          git push origin main
